<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#070809" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)" />
        <script>
            // Runs before paint. An explicit choice wins; otherwise the system preference applies via CSS.
            try {
                const theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
            } catch {}
            // Hide the page until the shader has compiled, then the layout reveals it. Without
            // JavaScript this never runs and the page shows as normal. The timer is a failsafe in
            // case the app bundle never boots.
            document.documentElement.dataset.boot = 'loading';
            setTimeout(() => {
                const root = document.documentElement;
                if (root.dataset.boot !== 'loading') return;
                root.dataset.boot = 'entering';
                setTimeout(() => delete root.dataset.boot, 1800);
            }, 6000);
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
