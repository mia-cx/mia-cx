<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="theme-color"
            content="#221820"
            media="(prefers-color-scheme: dark)"
            data-scheme="dark"
        />
        <meta
            name="theme-color"
            content="#ffffff"
            media="(prefers-color-scheme: light)"
            data-scheme="light"
        />
        <script>
            // Runs before paint, from the keys `$lib/settings` keeps. An explicit theme wins, for the page
            // and the browser chrome; otherwise the system preference applies via CSS and the media
            // queries. The share card at /og is always dark, whoever renders it. Motion is always set,
            // from the reader's choice or the system's, so CSS reads one attribute.
            let fieldOff = false;
            try {
                const motion = localStorage.getItem('motion');
                document.documentElement.dataset.motion =
                    motion === 'reduce' || motion === 'full'
                        ? motion
                        : matchMedia('(prefers-reduced-motion: reduce)').matches
                          ? 'reduce'
                          : 'full';
                fieldOff = localStorage.getItem('field') === 'false';
                if (fieldOff) document.documentElement.dataset.field = 'off';
            } catch {}
            try {
                const theme =
                    location.pathname === '/og'
                        ? 'dark'
                        : localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.dataset.theme = theme;
                    for (const meta of document.querySelectorAll(
                        'meta[name="theme-color"]',
                    ))
                        meta.media =
                            meta.dataset.scheme === theme ? 'all' : 'not all';
                }
            } catch {}
            // Hide the home page until the shader has compiled, then the layout reveals it. Every
            // other page shows its content at once while the shader fades in behind it. Without
            // JavaScript this never runs and the page shows as normal. A slow GPU or a broken
            // bundle never keeps the page blank for more than 2.5 s: this reveals it regardless.
            // With the field off there is nothing to wait for.
            if (location.pathname === '/' && !fieldOff)
                document.documentElement.dataset.boot = 'loading';
            setTimeout(() => {
                const root = document.documentElement;
                if (root.dataset.boot !== 'loading') return;
                root.dataset.boot = 'entering';
                setTimeout(() => delete root.dataset.boot, 1800);
            }, 2500);
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
