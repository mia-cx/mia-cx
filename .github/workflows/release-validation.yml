name: Release validation

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: release-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

jobs:
    checks:
        name: Release validation
        if: >-
            github.event_name != 'pull_request' ||
            (github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install the browser for the site's tests
              run: pnpm --filter @mia-cx/mia.cx exec playwright install --with-deps chromium

            - name: Check code
              run: |
                  pnpm --filter "@mia-cx/mia.cx..." --if-present run lint
                  pnpm --filter "@mia-cx/mia.cx..." --if-present run check
                  pnpm --filter "@mia-cx/mia.cx..." --if-present run test
                  pnpm --filter @mia-cx/mia.cx build
