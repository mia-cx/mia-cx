name: Deploy

on:
    workflow_call:
        inputs:
            environment:
                description: staging or production
                required: true
                type: string
            sha:
                description: Exact main commit to deploy; empty deploys the newest release merged into main
                required: false
                type: string
                default: ''
        outputs:
            sha:
                description: The commit that was deployed
                value: ${{ jobs.deploy.outputs.sha }}

permissions:
    contents: read
    pull-requests: read

jobs:
    deploy:
        name: Check and deploy to ${{ inputs.environment }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # One deploy per environment at a time. GitHub keeps only the newest waiting run, which is
        # why an automatic production deploy ships the newest release rather than its own commit.
        concurrency:
            group: deploy-${{ inputs.environment }}
            cancel-in-progress: false
        outputs:
            sha: ${{ steps.target.outputs.sha }}
        environment:
            name: ${{ inputs.environment }}
            url: ${{ inputs.environment == 'production' && 'https://mia.cx' || 'https://staging.mia.cx' }}
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            # Organisation-wide, so every repository deploys to the same account.
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.sha || 'main' }}
                  fetch-depth: ${{ inputs.sha && 1 || 0 }}

            # Releases reach the queue out of order and waiting runs get dropped, so whichever run holds
            # the slot ships the newest release on main. It can never land an older release after a
            # newer one, and a dropped run's release still goes out with the run that replaced it.
            - name: Choose the commit to deploy
              id: target
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ inputs.sha }}
              run: |
                  if [ -n "$SHA" ]; then
                    echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  # Ask GitHub for the newest release pull request merged from this repository, so its merge
                  # commit is right however it was merged: merge commit, squash or rebase. Like the release
                  # check, only one that changes the site's version counts as a release.
                  sha="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head changeset-release/main --state merged \
                    --limit 20 --json mergeCommit,mergedAt,isCrossRepository,files \
                    --jq '[.[] | select((.isCrossRepository | not) and any(.files[]; .path == "apps/mia.cx/package.json"))] | sort_by(.mergedAt) | last | .mergeCommit.oid // empty')"
                  if [ -z "$sha" ]; then
                    echo 'No release pull request has been merged into main' >&2
                    exit 1
                  fi
                  git merge-base --is-ancestor "$sha" HEAD
                  git checkout -q "$sha"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install the browser for the site's tests
              run: pnpm --filter @mia-cx/mia.cx exec playwright install --with-deps chromium

            - name: Check code
              run: |
                  pnpm --filter "@mia-cx/mia.cx..." --if-present run lint
                  pnpm --filter "@mia-cx/mia.cx..." --if-present run check
                  pnpm --filter "@mia-cx/mia.cx..." --if-present run test
                  pnpm --filter @mia-cx/mia.cx build

            # Staging serves the same pages as mia.cx; keep its copy out of search results.
            - name: Keep staging out of search results
              if: inputs.environment == 'staging'
              run: |
                  printf '\n/*\n  X-Robots-Tag: noindex\n' >> apps/mia.cx/.svelte-kit/cloudflare/_headers

            - name: Deploy
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
                  SHA: ${{ steps.target.outputs.sha }}
              run: |
                  version="$(node -p "require('./apps/mia.cx/package.json').version")"
                  args=(--message "mia.cx $version at ${SHA:0:7}")
                  [ "$ENVIRONMENT" = staging ] && args+=(--env staging)
                  pnpm --filter @mia-cx/mia.cx exec wrangler deploy "${args[@]}"
