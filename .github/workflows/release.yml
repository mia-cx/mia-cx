name: Release

# Every push to main deploys to staging.mia.cx and opens or updates the Changesets release pull
# request. Merging that pull request versions the site and, once staging is up, deploys it to mia.cx.
on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            release_sha:
                description: Redeploy production at this 40-character release merge commit
                type: string
                required: true

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    version:
        name: Version mia.cx
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release: ${{ steps.release.outputs.release }}
            sha: ${{ steps.release.outputs.sha }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check release tooling
              run: pnpm test:release

            - name: Identify a merged release pull request
              id: release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RETRY_SHA: ${{ inputs.release_sha }}
              run: |
                  sha="${RETRY_SHA:-$GITHUB_SHA}"
                  if ! [[ "$sha" =~ ^[a-f0-9]{40}$ ]]; then
                    echo 'release_sha must be a full commit SHA' >&2
                    exit 1
                  fi
                  git merge-base --is-ancestor "$sha" origin/main
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  # Only a commit that bumps the site's version can be a release. The commit-to-pull-request
                  # index lags a fresh merge, so ask again for a minute before calling it not a release.
                  release=false
                  if ! git diff --quiet "$sha^1" "$sha" -- apps/mia.cx/package.json; then
                    for _ in 1 2 3 4 5 6; do
                      release="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --paginate --slurp | node .github/scripts/release-merge.mjs "$sha" "$GITHUB_REPOSITORY")"
                      [ "$release" = true ] && break
                      sleep 10
                    done
                  fi
                  if [ -n "$RETRY_SHA" ] && [ "$release" != true ]; then
                    echo "$sha is not a merged release pull request" >&2
                    exit 1
                  fi
                  echo "release=$release" >> "$GITHUB_OUTPUT"

            - name: Open or update the release pull request
              if: github.event_name == 'push'
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
              with:
                  version-script: pnpm release:version
                  commit-message: 'chore(release): version mia.cx'
                  pr-title: 'chore(release): version mia.cx'
                  pr-base-branch: main
                  create-github-releases: false
                  push-git-tags: false

    staging:
        name: Deploy to staging
        needs: version
        # A production redeploy leaves staging on main rather than rolling it back to the release.
        if: github.event_name == 'push'
        uses: ./.github/workflows/deploy.yml
        with:
            environment: staging
            sha: ${{ needs.version.outputs.sha }}
        secrets: inherit
        permissions:
            contents: read

    production:
        name: Deploy approved release
        needs: [version, staging]
        # Staging goes first and must succeed, unless this is a redeploy that skips it.
        if: >-
            !cancelled() &&
            needs.version.result == 'success' &&
            needs.version.outputs.release == 'true' &&
            (needs.staging.result == 'success' || needs.staging.result == 'skipped')
        uses: ./.github/workflows/deploy.yml
        with:
            environment: production
            sha: ${{ needs.version.outputs.sha }}
        secrets: inherit
        permissions:
            contents: read

    tag:
        name: Tag the deployed release
        needs: [version, production]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            SHA: ${{ needs.version.outputs.sha }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.sha }}

            - name: Tag the release commit
              run: |
                  tag="mia.cx@v$(node -p "require('./apps/mia.cx/package.json').version")"
                  git fetch --tags origin
                  if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                    echo "$tag already exists"
                    exit 0
                  fi
                  git tag "$tag" "$SHA"
                  git push origin "refs/tags/$tag"
